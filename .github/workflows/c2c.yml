# Every morning: fresh camptocamp.org topos and outings (conditions reported by climbers), ski pistes and webcams
# (OpenStreetMap) for each massif, and the snow measured by Météo-France's mountain stations, copied into data/ (the app cannot ask camptocamp from the browser: CORS), then the site is rebuilt.
name: camptocamp quotidien
on:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC, 06:17 in Chamonix (summer time)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  c2c:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # six massifs at one camptocamp request every 0.5 s: about an hour
    steps:
      - uses: actions/checkout@v5
      - name: Copie camptocamp
        run: python3 scripts/c2c.py
      - name: Pistes de ski (OpenStreetMap)
        run: python3 scripts/pistes.py
      - name: Webcams (OpenStreetMap)
        run: python3 scripts/webcams.py
      - name: Hauteur de neige mesurée (Météo-France, réseau nivo)
        run: python3 scripts/nivo.py
      - name: Publier si changé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/c2c-*.json
          git add data/pistes-*.json data/webcams-*.json data/nivo.json 2>/dev/null || true   # none yet if a source never answered
          if git diff --cached --quiet; then echo "rien de neuf"; exit 0; fi
          git commit -m "Données du jour : camptocamp, pistes, webcams, neige mesurée"
          # the app may have been published meanwhile: take those commits first (only data/ changes here)
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 10; done
          # a push made with this token does not start the Pages build by itself
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
